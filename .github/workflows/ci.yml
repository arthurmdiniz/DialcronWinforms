name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DialcronWinforms.sln

      - name: Build
        run: dotnet build DialcronWinforms.sln --no-restore -c Release

      - name: Test
        run: dotnet test DialcronWinforms.sln --no-build -c Release --verbosity normal
