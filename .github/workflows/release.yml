name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish DialcronWinforms.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Compactar artefato
        run: Compress-Archive -Path publish\* -DestinationPath DialcronWinforms-${{ github.ref_name }}-win-x64.zip

      - name: Criar release no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} DialcronWinforms-${{ github.ref_name }}-win-x64.zip --generate-notes --title "DialcronWinforms ${{ github.ref_name }}"
